name: CI

# The gate. Every tier runs through the chore task a developer runs, and
# every family script runs in place from the rust-fs-core sibling.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The merge queue's run on main plus the queued pull requests: the run
  # that decides whether they land.
  merge_group:
  # Callable so release.yml runs THIS gate rather than a copy of it.
  workflow_call:
    inputs:
      reproducer:
        description: Evidence path for a reusable invocation
        type: string
        default: full
      fresh_fixtures:
        description: Build the fixtures even if a kept build answers this tree
        type: boolean
        default: false
  # A dispatch runs the full gate unless it names one focused reproducer.
  # tests/scripts/ci-depth.sh holds this default to the command in AGENTS.md.
  workflow_dispatch:
    inputs:
      reproducer:
        description: Evidence path to run on this branch
        type: choice
        default: full
        options:
          - full
          - write-study-lifecycle
          - crc128-native
      fresh_fixtures:
        description: Build the fixtures even if a kept build answers this tree
        type: boolean
        default: false

# A newer push to a pull request cancels the run still going on the older one,
# except while the pull request's title starts "red:". Such a pull request
# holds only its failing test, and its run is the red evidence: it gets a group
# of its own commit and is never cancelled, so the push that adds the fix, made
# after the title loses "red:", cannot cancel it either. Keyed by the commit
# because GitHub keeps one pending run per group even with cancelling off: a
# second push sharing the group would replace the red run while it waits.
# tests/scripts/test-red-runs-uncancelled.sh fails if that stops being so.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}${{ startsWith(github.event.pull_request.title, 'red:') && format('-red-{0}', github.event.pull_request.head.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !startsWith(github.event.pull_request.title, 'red:') }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CHORE_VERSION: "0.11.0"
  # Static contract declarations for mode-conditional jobs. Runtime ci-ok
  # still requires every applicable job to succeed; these exemptions never
  # authorize a failed, cancelled or unexpectedly skipped dependency.
  CI_GATE_NON_GATING: "changes unit lint semver guest-write-study crc128-native"

jobs:
  guest-write-study:
    name: guest write-study lifecycle (isolated, no fixtures or VM)
    if: github.event_name == 'workflow_dispatch' && inputs.reproducer == 'write-study-lifecycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run only the write-study lifecycle regression
        run: bash tests/scripts/guest-write-study-cleans-up.sh
      - name: Keep the guard's diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-write-study-diagnostics
          path: tmp/logs/*.log
          if-no-files-found: error

  crc128-native:
    if: github.event_name == 'workflow_dispatch' && inputs.reproducer == 'crc128-native'
    uses: ./.github/workflows/crc128-native-repro.yml

  # Does this run need the full pipeline? Pull requests, every layer of a
  # stack included, run the quick checks (unit, scripts, lint, semver). The
  # merge queue runs everything on the exact tree it is about to land, and
  # so do tags, manual dispatches, and a release calling this workflow (its
  # event is the caller's: a tag push or a dispatch). A push to main does not
  # repeat the queue's oracle work. Anything unexpected runs everything. The
  # jobs that boot the VM or read its fixtures run only when the answer is
  # true, and ci-ok accepts their skip when, and only when, it is false.
  # A pull request that changes what the fixtures are made from
  # (scripts/fixture-key.sh) runs everything too, in its own run: no kept build
  # answers it, so nothing else would build and test its fixtures before the
  # queue. A layer of a stack answers for its own change, not the layers below.
  changes:
    name: changes (does this need the full pipeline?)
    if: github.event_name != 'workflow_dispatch' || inputs.reproducer == 'full'
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.c.outputs.code == 'true' || steps.k.outputs.changed == 'true' }}
      runners: ${{ steps.runners.outputs.runners || '{}' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Classify the change
        id: c
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          code=true
          case "$EVENT" in
            pull_request) code=false ;;
            push) [ "$REF" != refs/heads/main ] || code=false ;;
          esac
          echo "full pipeline: $code ($EVENT $REF)"
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Does this pull request change what the fixtures are made from?
        id: k
        if: github.event_name == 'pull_request'
        run: bash scripts/fixture-key.sh --changed-from HEAD^1 >> "$GITHUB_OUTPUT"
      # The runner gate (autobalancer): one pick per gated job. Jobs that
      # need /dev/kvm (fixtures, suite-in-vm), arm64, macOS and ci-ok stay on
      # GitHub-hosted runners. Only jobs that will run get a pick.
      - name: Pick runners
        id: runners
        env:
          ORG: ${{ github.repository_owner }}
          ACTOR: ${{ github.triggering_actor }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          SENDER: ${{ github.event.sender.login }}
          GH_ACTOR: ${{ github.actor }}
          CODE: ${{ steps.c.outputs.code == 'true' || steps.k.outputs.changed == 'true' }}
        run: |
          set -euo pipefail
          JOBS="unit lint semver"
          [ "$CODE" != true ] || JOBS="$JOBS oracle cli coverage"
          ours=true
          for who in "$ACTOR" "$GH_ACTOR" "$SENDER" "$AUTHOR"; do
            [ -z "$who" ] || [ "$who" = christhomas ] || ours=false
          done
          pick() {
            $ours || { echo ubuntu-latest; return; }
            r=$(curl -fsS --max-time 10 --get https://runner-gate.antimatter-studios.com/pick \
                  --data-urlencode "org=$ORG" --data-urlencode prefer=antimatter-vps-linux-x64 \
                  --data-urlencode fallback=ubuntu-latest --data-urlencode "actor=$ACTOR" --data-urlencode "author=$AUTHOR" \
                  --data-urlencode "run=${{ github.run_id }}" --data-urlencode "attempt=${{ github.run_attempt }}" \
                  --data-urlencode "job=$1") || r=ubuntu-latest
            case "$r" in antimatter-vps-linux-x64|ubuntu-latest) echo "$r" ;; *) echo ubuntu-latest ;; esac
          }
          runners='{}'
          for job in $JOBS; do runners=$(jq -c --arg j "$job" --arg r "$(pick "$job")" '. + {($j): $r}' <<<"$runners"); done
          echo "$runners" | jq . | tee -a "$GITHUB_STEP_SUMMARY"
          echo "runners=$runners" >> "$GITHUB_OUTPUT"

  unit:
    name: unit (no tools, no fixtures)
    if: github.event_name != 'workflow_dispatch' || inputs.reproducer == 'full'
    needs: changes
    runs-on: ${{ fromJSON(needs.changes.outputs.runners)['unit'] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tools for the self-hosted runner
        run: |
          command -v cc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y build-essential; }
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y python3-yaml; }
          command -v cpio >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y cpio; }
      - name: Test images have scoped owners
        run: python3 scripts/check-test-images.py
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-unit-cargo-${{ hashFiles('**/Cargo.lock') }}
      # The unit tier must prove it needs no fixture.
      - name: No fixtures are present
        run: |
          set -euo pipefail
          if [ -d .vm-share/fixtures ]; then
            echo "::error::.vm-share/fixtures exists; this job must prove the unit tier needs none"
            exit 1
          fi
      - name: chore test:unit
        run: chore test:unit
      - name: chore test:scripts
        run: chore test:scripts
      - name: Keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-unit
          path: tmp/logs/*.log
          if-no-files-found: error

  lint:
    name: lint (fmt, clippy, family-check, agents-core, ci-gate, licences)
    if: github.event_name != 'workflow_dispatch' || inputs.reproducer == 'full'
    needs: changes
    runs-on: ${{ fromJSON(needs.changes.outputs.runners)['lint'] || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tools for the self-hosted runner
        run: |
          command -v cc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y build-essential; }
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y python3-yaml; }
          command -v cpio >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y cpio; }
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-cargo-${{ hashFiles('**/Cargo.lock') }}
      # The licence gate (scripts/licenses.sh) needs cargo-deny; a prebuilt
      # binary, not a 5-minute `cargo install`.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: chore lint
        run: chore lint

  # The reference tools build the fixtures, inside the harness VM, on an
  # x86_64 runner with KVM. Nothing of theirs ever runs on the runner. A build
  # is kept per fixture key, so this fetches one unless this tree's key has none
  # or the run asks for a fresh one (scripts/kept-fixtures.sh says exactly when).
  # Either way it uploads the `fixtures` artifact every later job reads.
  # A green `chore fixtures` run takes 13 to 19 minutes. The full job also
  # provisions KVM and packs the result: run 40309210102 spent 20m27s setting
  # up and 14m13s generating fixtures, then hit 35m while packing. The 45m
  # limit leaves 10m for packing and upload; #94's runs hung until 90m.
  fixtures:
    name: fixtures (kept, or built in the harness VM, x86_64 KVM)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: A kept build, or a fresh one?
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          FRESH: ${{ inputs.fresh_fixtures || startsWith(github.ref, 'refs/tags/') }}
        run: bash scripts/kept-fixtures.sh select >> "$GITHUB_OUTPUT"
      - name: Fetch the kept build
        if: steps.source.outputs.kept == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          SHA256: ${{ steps.source.outputs.sha256 }}
        run: bash scripts/kept-fixtures.sh fetch "$TAG" "$SHA256" "$RUNNER_TEMP"
      - name: Install chore
        if: steps.source.outputs.kept != 'true'
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        if: steps.source.outputs.kept != 'true'
        run: chore siblings
      - name: KVM, QEMU and Vagrant
        id: vm-host
        if: steps.source.outputs.kept != 'true'
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        if: steps.source.outputs.kept != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      # This crate's tools write a file the reference kernel module then
      # reads back (#141), so the fixture build compiles them.
      - name: Install Rust
        if: steps.source.outputs.kept != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: chore fixtures
        if: steps.source.outputs.kept != 'true'
        run: chore fixtures
      - name: chore vm:status (the VM is down again)
        if: steps.source.outputs.kept != 'true'
        run: '! chore vm:status'
      - name: Pack the fixtures, keeping their holes
        if: steps.source.outputs.kept != 'true'
        run: |
          set -euo pipefail
          du -sh .vm-share/fixtures
          tar --sparse -czf "$RUNNER_TEMP/fixtures.tar.gz" -C .vm-share fixtures
          ls -lh "$RUNNER_TEMP/fixtures.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: ${{ runner.temp }}/fixtures.tar.gz
          if-no-files-found: error
          retention-days: 7
      # The record of a hung guest (#500). QEMU writes these as the guest runs,
      # so they are there even when the job was cancelled during a boot. Only
      # the guests' logs: nothing the reference tools printed, and no image.
      - name: Keep the kernel-oracle console logs of a build that did not finish
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-oracle-console
          path: |
            tmp/kernel-oracle/console.log
            tmp/kernel-oracle/oracle.log
            tmp/kernel-oracle/judge-console.log
            tmp/kernel-oracle/judge.log
          if-no-files-found: warn
          retention-days: 7
      # A failed build packs no fixtures, so its record of why (#577) goes up
      # on its own: the steps' transcript and the listings. No image.
      - name: Keep the crc128-overwrite record of a build that failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crc128-overwrite-record
          path: .vm-share/fixtures/crc128-overwrite*.txt
          if-no-files-found: warn
          retention-days: 7

  # This crate reads every fixture and must agree with what the reference
  # tools recorded about it, field by field and byte by byte.
  oracle:
    name: oracle (fixtures vs the reference tools' record)
    needs: [changes, fixtures]
    runs-on: ${{ fromJSON(needs.changes.outputs.runners)['oracle'] || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build tools for the self-hosted runner
        run: |
          command -v cc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y build-essential; }
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y python3-yaml; }
          command -v cpio >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y cpio; }
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-oracle-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: ${{ runner.temp }}
      - name: Unpack the fixtures
        run: |
          set -euo pipefail
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures.tar.gz" -C .vm-share
          ls -l .vm-share/fixtures
      - name: chore test:oracle
        run: chore test:oracle
      - name: Keep the tier logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-oracle
          path: tmp/logs/*.log
          if-no-files-found: error

  # GitHub's arm64 runners have no /dev/kvm, so no VM starts here; nothing
  # in the oracle tier needs one -- it reads the images and the reference
  # tools' recorded view of them, which are the same bytes on every
  # architecture.
  test-arm64:
    name: test (aarch64, no KVM on this runner)
    needs: fixtures
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-aarch64-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: ${{ runner.temp }}
      - name: Unpack the fixtures
        run: |
          set -euo pipefail
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures.tar.gz" -C .vm-share
          ls -1 .vm-share/fixtures | wc -l | xargs echo "fixture files:"
      # The licence gate (scripts/licenses.sh) needs cargo-deny; a prebuilt
      # binary, not a 5-minute `cargo install`.
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: chore lint
        run: chore lint
      - name: chore test:unit
        run: chore test:unit
      - name: chore test:oracle
        run: chore test:oracle
      - name: Keep the tier logs
        # A tier keeps its whole run in tmp/logs/<tier>.log and prints a
        # verdict naming it; the runner is thrown away minutes later.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-aarch64
          path: tmp/logs/*.log
          if-no-files-found: error

  test-darwin:
    name: test-darwin
    needs: fixtures
    # arm64 by label: the tests built for aarch64-apple-darwin run on the host.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: aarch64-apple-darwin
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-darwin-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: ${{ runner.temp }}
      - name: Unpack the fixtures
        run: |
          set -euo pipefail
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures.tar.gz" -C .vm-share
          ls -1 .vm-share/fixtures | wc -l | xargs echo "fixture files:"
      # The static library a macOS consumer links. A break here would ship
      # while every Linux job stayed green.
      - name: Build the shipped staticlib for aarch64-apple-darwin
        run: cargo build --locked --release --lib --target aarch64-apple-darwin
      - name: chore test:unit
        run: chore test:unit
      - name: chore test:oracle
        run: chore test:oracle
      - name: chore cli:install
        run: chore cli:install
      - name: The staged tools first on PATH
        run: scripts/cli-install.sh --print-bin-dir >> "$GITHUB_PATH"
      - name: chore test:cli
        run: chore test:cli
      # The shell guards on the host they most often break on: BSD tools, the
      # /var symlink, no setsid or timeout (#411, #412). The unit job runs them
      # on Linux. PyYAML is what the workflow guards read ci.yml with.
      - name: Python with PyYAML
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: python -m pip install pyyaml
      - name: chore test:scripts
        run: chore test:scripts
      - name: Keep the tier logs
        # A tier keeps its whole run in tmp/logs/<tier>.log and prints a
        # verdict naming it; the runner is thrown away minutes later.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-darwin
          path: tmp/logs/*.log
          if-no-files-found: error

  # The whole suite compiled and run INSIDE the harness guest: the path a
  # Mac takes for the Linux tests. No Rust on the runner; the guest installs
  # the toolchain rust-toolchain.toml pins.
  suite-in-vm:
    name: suite in the guest (the macOS path)
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: ${{ runner.temp }}
      - name: Unpack the fixtures
        run: |
          set -euo pipefail
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures.tar.gz" -C .vm-share
          ls -1 .vm-share/fixtures | wc -l | xargs echo "fixture files:"
      - name: chore test:vm
        run: chore test:vm
      - name: Keep the tier logs
        # A tier keeps its whole run in tmp/logs/<tier>.log and prints a
        # verdict naming it; the runner is thrown away minutes later.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-suite-in-vm
          path: tmp/logs/*.log
          if-no-files-found: error
      - name: chore vm:status (the VM is down again)
        run: '! chore vm:status'

  cli:
    name: cli (the installed tools, on PATH)
    needs: [changes, fixtures]
    runs-on: ${{ fromJSON(needs.changes.outputs.runners)['cli'] || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build tools for the self-hosted runner
        run: |
          command -v cc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y build-essential; }
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y python3-yaml; }
          command -v cpio >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y cpio; }
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cli-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: ${{ runner.temp }}
      - name: Unpack the fixtures
        run: |
          set -euo pipefail
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures.tar.gz" -C .vm-share
          ls -1 .vm-share/fixtures | wc -l | xargs echo "fixture files:"
      - name: chore cli:install
        run: chore cli:install
      # FIRST on PATH, so the tier tests these and not anything else of the
      # same name; `rust-fs-bcachefs doctor` proves it before any test runs.
      - name: The staged tools first on PATH
        run: scripts/cli-install.sh --print-bin-dir >> "$GITHUB_PATH"
      - name: chore test:cli
        id: tier
        run: chore test:cli
      # The release tarball's layout, on every pull request rather than
      # after a tag: rust-fs-core's package-cli.sh, run in place, is what
      # the release's CLI workflow runs on each platform.
      - name: Package the release tarball and check its layout
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          tarball="$(bash ../rust-fs-core/scripts/package-cli.sh "$version" linux-x86_64 | tail -n 1)"
          tar -tvzf "$tarball"
      - name: Keep the tier logs
        # A tier keeps its whole run in tmp/logs/<tier>.log and prints a
        # verdict naming it; the runner is thrown away minutes later.
        if: always() && steps.tier.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-cli
          path: tmp/logs/*.log
          if-no-files-found: error

  semver:
    # `chore check:semver`: this tree's public API against its baseline,
    # refusing a break the version in Cargo.toml does not declare. See
    # scripts/check-semver.sh for which baseline, and why.
    name: semver (public API against its baseline)
    if: github.event_name != 'workflow_dispatch' || inputs.reproducer == 'full'
    needs: changes
    runs-on: ${{ fromJSON(needs.changes.outputs.runners)['semver'] || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      CARGO_SEMVER_CHECKS_VERSION: "0.50.0"
      # Here the tail IS the answer -- which items broke.
      OUTPUT_BUDGET_FAIL_TAIL: "200"
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline before publication is main, so it must be fetched.
          fetch-depth: 0
      - name: Build tools for the self-hosted runner
        run: |
          command -v cc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y build-essential; }
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y python3-yaml; }
          command -v cpio >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y cpio; }
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks@${{ env.CARGO_SEMVER_CHECKS_VERSION }}
      - name: chore check:semver
        shell: bash
        run: chore check:semver

  # Line coverage of the unit and oracle tiers, failing under a measured
  # floor (chores.yml, task `coverage`).
  coverage:
    name: coverage (unit and oracle tiers)
    needs: [changes, fixtures]
    runs-on: ${{ fromJSON(needs.changes.outputs.runners)['coverage'] || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build tools for the self-hosted runner
        run: |
          command -v cc >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y build-essential; }
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -qq && sudo apt-get install -y python3-yaml; }
          command -v cpio >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y cpio; }
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-coverage-cargo-${{ hashFiles('**/Cargo.lock') }}
      - uses: actions/download-artifact@v4
        with:
          name: fixtures
          path: ${{ runner.temp }}
      - name: Unpack the fixtures
        run: |
          set -euo pipefail
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures.tar.gz" -C .vm-share
      - name: chore coverage
        id: tier
        run: chore coverage
      - name: Keep the tier logs
        if: always() && steps.tier.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: tier-logs-coverage
          path: tmp/logs/*.log
          if-no-files-found: error

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, unit, lint, fixtures, oracle, test-arm64, test-darwin, suite-in-vm, cli, semver, coverage, guest-write-study, crc128-native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verdict contract rejects failed, cancelled and unexpected skips
        run: python3 scripts/ci-verdict.py --check-contract
      - name: Independent subprocess controls for every verdict profile
        run: python3 tests/scripts/ci-verdict-black-box.py
      - name: Every applicable job ran and succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          CODE: ${{ needs.changes.outputs.code }}
          EVENT: ${{ github.event_name }}
          REPRODUCER: ${{ inputs.reproducer }}
          # Retained as an independently checked declaration for ci-depth.
          FULL_JOBS: '["fixtures", "oracle", "test-arm64", "test-darwin", "suite-in-vm", "cli", "coverage"]'
        run: python3 scripts/ci-verdict.py
