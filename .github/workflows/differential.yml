name: differential

# Differential fuzzing (#164): this crate and the reference checker on the
# same damaged images, every disagreement classified and counted, and the
# run failed by a class of disagreement fuzz/differential-baseline.tsv does
# not list. scripts/differential-fuzz.sh is the whole of it; this workflow
# only gives it a runner, the fixtures and a schedule.
#
# NOT A PULL-REQUEST GATE, and never a required check: what it finds depends
# on its seeds, so a fresh finding would fail whichever unrelated change
# happened to be open. It runs nightly, each night on new seeds; on demand;
# and on pull requests that change the harness itself. Pull requests use the
# kept fixtures of the differential-fixtures-1 release, which do not expire
# (#386), and 80 cases starting at seed 1659440; dispatches default to seed 0
# unless another seed or replay is requested.
#
# The nightly and a dispatch left at its defaults judge the newest green main
# run's fixtures, and read nothing fetched by number. The pinned jobs and the
# steps bound to the kept bytes run only where those bytes are judged: a pull
# request, or a dispatch with fixture_run set to `kept`.
# tests/scripts/differential-nightly-has-no-pinned-input.sh fails if that stops
# being so.
#
# DISCLOSURE (AGENTS.md, "A crash in the reference stays private"). The
# only things this workflow publishes are the report's counts and the
# classes that are this crate's to fix. Nothing of a case on which the
# reference crashed or hung reaches the report, the job summary or an
# artifact: the harness deletes its patch and never keeps its output.
on:
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases per fixture"
        required: false
        default: "80"
      first_seed:
        description: "First seed (empty: 0)"
        required: false
        default: ""
      fixture_run:
        description: "CI run whose fixtures artifact to judge (empty: the newest green main run; `kept`: the differential-fixtures-1 release, with the pinned jobs)"
        required: false
        default: ""
      fixture_digest:
        description: "Expected fixtures artifact digest, sha256:... (required with fixture_run)"
        required: false
        default: ""
      replay:
        description: "Replay fuzz/differential-replay.tsv: its fixtures, cases and seed; keep its cases and fail unless each lands in its class"
        type: boolean
        required: false
        default: false
      replay_file:
        description: "The pin file a replay reads (empty: fuzz/differential-replay.tsv)"
        required: false
        default: ""
      keep:
        description: "Case IDs to keep, space-separated (e.g. default-74): each one's patch, mutation and reference output, judged against the fixture_run given"
        required: false
        default: ""
  schedule:
    - cron: "30 4 * * *"
  pull_request:
    paths:
      - .github/workflows/differential.yml
      - scripts/differential-fuzz.sh
      - scripts/differential-fuzz.py
      - scripts/default74_native_proof.py
      - tests/default74_native_proof.py
      - tests/data/default-74-38840695392.patch
      - scripts/select-fixture-run.sh
      - scripts/kept-fixtures.sh
      - examples/differential.rs
      - fuzz/differential-baseline.tsv
      - fuzz/differential-replay*.tsv
      - fuzz/shared/**
      - tests/oracle_differential_default74.rs
      - tests/oracle_differential_snapshot_tree_subvolume.rs
      - tests/scripts/differential-nightly-has-no-pinned-input.sh
      - scripts/pinned-snapshot-tree-subvolume.sh
      - scripts/pinned-default74-reference.sh
      - scripts/pinned-default74-read-controls.py
      - scripts/pinned-default74-observation-controls.sh
      - scripts/differential-read-classification-controls.py

concurrency:
  group: differential-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only unless a job asks for more.
permissions:
  contents: read

env:
  # The kept build every pinned expectation here is recorded over. A number in
  # a test or a script below is bound to these bytes and to no other build.
  KEPT_TAG: differential-fixtures-1
  KEPT_TARBALL: 6edbb7c0675ce7735a49ec173c0d371d707847a4885946d2010c1ebad51f36d7
  REPLAY_FILE: ${{ inputs.replay_file || 'fuzz/differential-replay.tsv' }}
  CARGO_TERM_COLOR: always
  CHORE_VERSION: "0.11.0"

jobs:
  # Replay an independently recorded positive observation, then deliberately
  # damage each observation. A failed read alone is not integrity evidence:
  # fsck passes both images, but only the exact mutated file must return EIO.
  default74-read-controls:
    name: default-206 read evidence rejection controls
    if: github.event_name == 'pull_request' || inputs.fixture_run == 'kept'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the digest-pinned independent read observations
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: 33232537b5b1862123aca61ce9a75d34c4fdaa588d1f9a969338932cef5a43b6
        run: |
          set -euo pipefail
          gh release download "$KEPT_TAG" --repo "$GITHUB_REPOSITORY" --pattern default206-reference.zip --dir "$RUNNER_TEMP"
          echo "$DIGEST  $RUNNER_TEMP/default206-reference.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/default206-reference.zip" -d "$RUNNER_TEMP/default74-read"
      - name: The live evidence grader accepts the recorded EIO and rejects invalid observations
        run: python3 scripts/pinned-default74-read-controls.py "$RUNNER_TEMP/default74-read"
      - name: The pinned job reads exactly one complete observation from its test's log
        run: bash scripts/pinned-default74-observation-controls.sh

  # Each case's expected values belong to one fixtures build, so it is judged
  # only over that build, fetched by its release and digest and refused on any
  # mismatch. The run fails unless exactly that one test ran and passed.
  # #219's and the others' cases were recorded over fixtures that expired on
  # 2026-10-22; #386 re-derived each over this build. Case default-206 is #219's
  # case: one extent's stored checksum changed, the reference's fsck passing
  # both images, and its read of the file failing with EIO.
  pinned-default74:
    name: pinned default-206 (#219, kept fixtures sha256:6edbb7c0)
    if: github.event_name == 'pull_request' || inputs.fixture_run == 'kept'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      PIN_DIGEST: "sha256:6edbb7c0675ce7735a49ec173c0d371d707847a4885946d2010c1ebad51f36d7"
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Fetch the kept fixtures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/kept-fixtures.sh fetch "$KEPT_TAG" "$KEPT_TARBALL" "$RUNNER_TEMP/fixtures"
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures/fixtures.tar.gz" -C .vm-share
          printf '%s\n' "$PIN_DIGEST" > .vm-share/fixtures-pin
      - name: The default-206 regression runs over them
        run: |
          set -euo pipefail
          cargo test --locked --release --features pinned-fixtures --test pinned_differential_default74 the_default_206_extent_data_mismatch_is_in_the_image -- --show-output 2>&1 | tee "$RUNNER_TEMP/default74.log"
          grep -q '^test the_default_206_extent_data_mismatch_is_in_the_image \.\.\. ok$' "$RUNNER_TEMP/default74.log" || { echo "the default-206 test did not run and pass" >&2; exit 1; }
          grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/default74.log" || { echo "expected exactly one executed test" >&2; exit 1; }
      - name: The exact block4k backpointer mismatch is reported (#256)
        run: |
          set -euo pipefail
          cargo test --locked --release --features pinned-fixtures --test pinned_differential_default74 the_block4k_1659443_backpointer_value_mismatch_is_reported -- --show-output 2>&1 | tee "$RUNNER_TEMP/backpointer256.log"
          grep -q '^test the_block4k_1659443_backpointer_value_mismatch_is_reported \.\.\. ok$' "$RUNNER_TEMP/backpointer256.log"
          grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/backpointer256.log"
      - name: The exact aged xattr size mismatch is reported (#258)
        run: |
          set -euo pipefail
          cargo test --locked --release --features pinned-fixtures --test pinned_differential_default74 the_aged_1659486_xattr_size_mismatch_is_reported -- --show-output 2>&1 | tee "$RUNNER_TEMP/xattr258.log"
          grep -q '^test the_aged_1659486_xattr_size_mismatch_is_reported \.\.\. ok$' "$RUNNER_TEMP/xattr258.log"
          grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/xattr258.log"
      - name: The exact aged-unclean journal length mismatch is reported (#262)
        run: |
          set -euo pipefail
          cargo test --locked --release --features pinned-fixtures --test pinned_differential_default74 the_aged_unclean_1659479_journal_length_mismatch_is_reported -- --show-output 2>&1 | tee "$RUNNER_TEMP/journal262.log"
          grep -q '^test the_aged_unclean_1659479_journal_length_mismatch_is_reported \.\.\. ok$' "$RUNNER_TEMP/journal262.log"
          grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/journal262.log"
      - name: An unused malformed superblock copy agrees with the reference (#261)
        run: |
          set -euo pipefail
          cargo test --locked --release --features pinned-fixtures --test pinned_differential_default74 a_zero_length_field_in_an_unused_superblock_copy_stays_clean -- --show-output 2>&1 | tee "$RUNNER_TEMP/superblock261.log"
          grep -q '^test a_zero_length_field_in_an_unused_superblock_copy_stays_clean \.\.\. ok$' "$RUNNER_TEMP/superblock261.log"
          grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/superblock261.log"
      - name: The pinned snapshot-tree subvolume regression runs once
        run: |
          set -euo pipefail
          cargo test --locked --release --features pinned-fixtures --test pinned_differential_snapshot_tree_subvolume -- --show-output 2>&1 | tee "$RUNNER_TEMP/snapshot-tree-subvolume.log"
          grep -q '^test kernel_1659511_reports_a_master_subvolume_in_another_snapshot_tree \.\.\. ok$' "$RUNNER_TEMP/snapshot-tree-subvolume.log"
          grep -q '^test result: ok\. 1 passed; 0 failed; 0 ignored' "$RUNNER_TEMP/snapshot-tree-subvolume.log"
      - name: The same 80 cases from seed 1659440 resolve the observed class
        run: bash scripts/pinned-snapshot-tree-subvolume.sh
      - name: Keep the snapshot-tree subvolume reference verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-tree-subvolume-reference
          path: |
            tmp/snapshot-tree-subvolume/evidence.txt
            tmp/snapshot-tree-subvolume/kept/
          if-no-files-found: error
          retention-days: 30
      # The reference checker's own verdict on the same bytes: `fsck -n` on
      # the fixture unchanged and on default-206's mutation, in the
      # differential harness's container, failed unless each is expected.
      # Then the reference reads the reported key's file through its own FUSE
      # mount on both images, recording each read's status and hash.
      - name: The reference's verdicts on default-206
        env:
          OURS_LOG: ${{ runner.temp }}/default74.log
        run: scripts/pinned-default74-reference.sh
      # Only cases judged without a crash are kept (the script's header).
      - name: Keep the reference's verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: default74-reference
          path: |
            tmp/default74-reference/evidence.txt
            tmp/default74-reference/kept/
            tmp/default74-reference/listing/
            tmp/default74-reference/read/
            tmp/default74-reference/read-proof.json
          if-no-files-found: error
          retention-days: 30

  # Not gated on the pinned jobs: they are skipped where their fixtures are
  # not judged, and a failure of theirs fails the run on its own.
  differential:
    needs: [pinned-default74, default74-read-controls]
    if: ${{ !cancelled() }}
    name: differential (this crate vs the reference checker, damaged images)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # issues: write, for filing a failed scheduled run (the last step);
    # actions: read, for the fixtures of the newest green main run.
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      # #226's retained proof: the reference's read of case default-74 and its
      # binding to the bytes of artifact 11977252185. Those bytes no longer exist,
      # so no run can judge it, and only a dispatch naming their run reaches it,
      # to fail at the fetch. Whether to re-record it over the kept build or
      # retire it is #430's decision; the observations themselves are assets of
      # the differential-fixtures-1 release. The same-run proof below, over the
      # kept bytes, is what a pull request judges.
      - name: Retained default-74 native read contract and rejection controls
        if: inputs.fixture_run == '38741040375'
        env:
          GH_TOKEN: ${{ github.token }}
          DIFFERENTIAL_NATIVE74_ARCHIVE: ${{ runner.temp }}/default74-native.zip
        run: |
          set -euo pipefail
          # Existing observations only: no second capture producer. Expired or
          # substituted artifacts fail, naming the exact required artifact.
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/12011667570/zip" > "$DIFFERENTIAL_NATIVE74_ARCHIVE"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/11977252185/zip" > "$RUNNER_TEMP/default74-fixtures.zip"
          python3 tests/default74_native_proof.py "$DIFFERENTIAL_NATIVE74_ARCHIVE" "$RUNNER_TEMP/default74-fixtures.zip"
          echo "DIFFERENTIAL_NATIVE74_ARCHIVE=$DIFFERENTIAL_NATIVE74_ARCHIVE" >> "$GITHUB_ENV"
      - name: Fetch the same-run independently graded physical-image read proof
        if: needs.pinned-default74.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: default74-reference
          path: ${{ runner.temp }}/native-read-proof
      - name: Classification controls retain the existing classes
        run: bash tests/scripts/differential-fuzz-classifies.sh
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-differential-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Building them takes the harness VM, so a pull request takes the kept
      # build and the nightly the newest green main run's, as the nightly fuzz
      # run does. A dispatch may name
      # the run instead, with its artifact's digest, to reproduce a report
      # exactly: the same seeds reach different nodes in rebuilt fixtures.
      # Either way the run, artifact and digests go into the report.
      # A replay takes everything from fuzz/differential-replay.tsv and keeps
      # only its named, non-crashing cases (none otherwise).
      - name: The pinned replay's settings
        if: inputs.replay
        run: |
          set -euo pipefail
          python3 scripts/differential-fuzz.py replay --expect "$REPLAY_FILE" --settings >"$RUNNER_TEMP/replay.env"
          cat "$RUNNER_TEMP/replay.env"
          while IFS='=' read -r key value; do
            case "$key" in
              fixture_run) echo "FIXTURE_RUN=$value" ;;
              fixture_digest) echo "FIXTURE_DIGEST=$value" ;;
              cases) echo "CASES=$value" ;;
              first_seed) echo "FIRST_SEED=$value" ;;
              keep) echo "DIFFERENTIAL_KEEP=$value" ;;
              listings) echo "DIFFERENTIAL_LISTINGS=$value" ;;
            esac
          done <"$RUNNER_TEMP/replay.env" >>"$GITHUB_ENV"

      - name: Fetch the fixtures
        env:
          GH_TOKEN: ${{ github.token }}
          KEPT: ${{ github.event_name == 'pull_request' || inputs.fixture_run == 'kept' }}
          FIXTURE_RUN: ${{ inputs.replay && env.FIXTURE_RUN || inputs.fixture_run || '' }}
          FIXTURE_DIGEST: ${{ inputs.replay && env.FIXTURE_DIGEST || inputs.fixture_digest || '' }}
        run: |
          set -euo pipefail
          mkdir -p .vm-share
          if [ "$KEPT" = true ]; then
            bash scripts/kept-fixtures.sh fetch "$KEPT_TAG" "$KEPT_TARBALL" "$RUNNER_TEMP/fixtures"
            from="release $KEPT_TAG, fixtures.tar.gz sha256:$KEPT_TARBALL"
          else
            read -r run artifact_id digest < <(bash scripts/select-fixture-run.sh "$GITHUB_REPOSITORY" "$FIXTURE_RUN" "$FIXTURE_DIGEST")
            # The artifact the selector named, by id, and only if its bytes
            # are the digest it was selected by.
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/fixtures.zip"
            if ! printf '%s  %s\n' "${digest#sha256:}" "$RUNNER_TEMP/fixtures.zip" | sha256sum --check --status; then
              echo "run $run artifact $artifact_id archive differs from $digest; no fallback" >&2
              exit 1
            fi
            unzip -q "$RUNNER_TEMP/fixtures.zip" -d "$RUNNER_TEMP/fixtures"
            tarball="$(sha256sum "$RUNNER_TEMP/fixtures/fixtures.tar.gz" | cut -d' ' -f1)"
            from="CI run $run, artifact $artifact_id ($digest), fixtures.tar.gz sha256:$tarball"
          fi
          tar -xzf "$RUNNER_TEMP/fixtures/fixtures.tar.gz" -C .vm-share
          echo "DIFFERENTIAL_FIXTURES_FROM=$from" >> "$GITHUB_ENV"
          echo "fixtures from $from: $(find .vm-share/fixtures -name '*.img' | wc -l) images"

      # Seed 0 unless asked otherwise; a scheduled night starts where the
      # day's number puts it, so no two nights judge the same cases.
      - name: chore fuzz:differential
        env:
          DIFFERENTIAL_READ_EVIDENCE: ${{ needs.pinned-default74.result == 'success' && format('{0}/native-read-proof', runner.temp) || '' }}
          CASES: ${{ inputs.replay && env.CASES || inputs.cases || '80' }}
          FIRST_SEED: ${{ inputs.replay && env.FIRST_SEED || inputs.first_seed || (github.event_name == 'pull_request' && '1659440') || '' }}
          DIFFERENTIAL_KEEP: ${{ inputs.replay && env.DIFFERENTIAL_KEEP || inputs.keep }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          seed="${FIRST_SEED:-0}"
          if [ "$EVENT" = schedule ]; then
            seed=$(( $(date -u +%s) / 86400 * CASES ))
          fi
          chore fuzz:differential -- "$CASES" "$seed"

      - name: The report, in the job summary
        if: always()
        run: |
          if [ -f tmp/differential/report.md ]; then
            cat tmp/differential/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      # Runs even when the classify step failed: a replay case absent from
      # its class is the failure this exists to report.
      - name: The pinned replay's classes were observed
        if: always() && inputs.replay
        run: python3 scripts/differential-fuzz.py replay tmp/differential --expect "$REPLAY_FILE"

      # Only the replay's (or the keep input's) named cases, each judged
      # without a crash; a crash or hang never reaches tmp/differential/kept,
      # so a named case that crashed fails here rather than going missing.
      - name: Keep the replayed cases
        if: always() && (inputs.replay || inputs.keep != '')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.replay && 'differential-replay' || 'differential-kept' }}
          path: |
            tmp/differential/kept/
            ${{ env.REPLAY_FILE }}
          if-no-files-found: error
          retention-days: 30

      # The report alone: cases.tsv, the patches and the reference's output
      # stay on the runner, which is thrown away.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: differential-report
          path: tmp/differential/report.md
          if-no-files-found: ignore
          retention-days: 30

      # A failed night is filed, not lost, as the nightly fuzz run's is.
      - name: File a failed scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly differential run failed"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci-failure \
              --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label ci-failure --title "$title" \
              --body "The scheduled differential run failed: $RUN_URL. Its report (the job summary, and the differential-report artifact) names each new disagreement class with an example; a class that is this crate's to fix becomes its own issue, and a line of fuzz/differential-baseline.tsv once tracked."
          fi
