name: crc128 native reproducer

# Diagnostic red/green path on the existing implementation branch. This is
# additional evidence; it never substitutes for the full fixture/oracle gate.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CHORE_VERSION: "0.11.0"
  CARGO_BUILD_JOBS: "2"
  # The shared guest's size. Harness v0.8.0 and later size it by a host
  # resource profile, which on a GitHub-hosted runner is a small guest (2G,
  # 2 CPUs). With that size the kernel SIGKILLs test binaries in the guest
  # (oracle_fuzz_whole_image and check_oracle on #718, run 44964869562). The
  # size the suites were validated on before the profiles is 4G and 4 CPUs,
  # as in rust-fs-xfs and rust-fs-btrfs.
  FLTH_SHARED_MEMORY: 4G
  FLTH_SHARED_CPUS: "4"

jobs:
  crc128-native-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64-kvm

  crc128-native:
    name: crc128 overwrite (reference FUSE, harness guest)
    needs: crc128-native-gate
    runs-on: ${{ needs.crc128-native-gate.outputs.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: C toolchain for the gated runner
        # Only a self-hosted Linux runner lacks it; the hosted image has it.
        run: |
          if [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            sudo apt-get update && sudo apt-get install -y build-essential
          fi
      - name: Owned FUSE lifecycle and refusal controls
        run: bash tests/scripts/guest-build-fixtures-cleans-up.sh
      - name: Keep the guard's diagnostic log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: guest-build-fixtures-diagnostics
          path: tmp/logs/*.log
          if-no-files-found: error
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: chore siblings
        run: chore siblings
      - name: Upstream virtiofsd 1.14.0
        # Ubuntu 24.04 packages virtiofsd 1.10.0, which never answers a
        # non-UTF-8 xattr name (fs-linux-test-harness #274). The tag must
        # match LINUX_HARNESS_REF in chores.yml.
        uses: antimatter-studios/fs-linux-test-harness/.github/actions/install-virtiofsd@v0.9.1
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: Reproduce only the native crc128 overwrite
        run: nice -n 10 bash scripts/repro-crc128-overwrite.sh
      - name: Keep native transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crc128-native-transcripts
          path: .vm-share/crc128-native-repro/*.txt
          if-no-files-found: error
          retention-days: 7
