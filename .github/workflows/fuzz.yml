name: fuzz

# The explorer half of the fuzzing setup. The gate half --
# tests/fuzz_decoders.rs -- runs in the `test` job of ci.yml on every
# pull request, because it is deterministic and finishes in under a
# second. This one is neither, and that is why it is here instead.
#
# A fuzzer's result depends on how long it ran. Putting it in the pull
# request gate would mean a fresh finding fails whichever unrelated
# change happened to be open at the time, and a green result would only
# ever mean "nothing found in the seconds we could spare" -- which is
# not a claim worth gating on.
#
# So it runs nightly and on demand, and when it finds something the
# reproducer is uploaded. That reproducer belongs in fuzz/corpus/, where
# the gate replays it on every pull request from then on. That handover
# is the whole point of the two halves sharing one corpus directory.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Seconds per target"
        required: false
        default: "120"
  schedule:
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  FS_CORE_REF: v0.3.13
  CARGO_INCREMENTAL: 0

# Read-only unless a job asks for more. This repository's default token
# is read-write, and a workflow that declares nothing inherits it, so every
# job here would otherwise hold a write token beside actions it does not
# pin.
permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz every parser a hostile image reaches
    runs-on: ubuntu-latest
    # Thirteen targets at two minutes each is roughly half an hour of
    # fuzzing; the rest is building cargo-fuzz and the targets.
    timeout-minutes: 90
    # issues: write, for filing a failed scheduled run (the last step);
    # actions: read, for the fixtures of the newest landed tree.
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Clone sibling rust-fs-core
        run: git clone --depth 1 --branch "$FS_CORE_REF" https://github.com/antimatter-studios/rust-fs-core.git ../rust-fs-core

      # Nightly, not the pin in rust-toolchain.toml. cargo-fuzz needs
      # `-Z sanitizer`, which stable does not have. The explicit
      # `+nightly` in scripts/fuzz-all.sh overrides the pin for these
      # invocations and nothing else.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      # Building cargo-fuzz takes several minutes and changes about as
      # often as the compiler does, so it is cached on its own version
      # rather than on the lockfile of this repository.
      - name: Cache cargo-fuzz
        id: cache-cargo-fuzz
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ runner.arch }}-v1

      - name: Install cargo-fuzz
        if: steps.cache-cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo +nightly install cargo-fuzz --locked

      # cargo-fuzz has no --locked of its own, so every fuzz build would
      # rewrite a stale fuzz/Cargo.lock in place and build something
      # nobody committed -- which it did, with rust-fs-core 0.2.10 locked
      # while the crate needed 0.2.13 (#258). Resolving under --locked
      # first turns that drift into a failure before anything is fuzzed.
      - name: The fuzz workspace resolves from its committed lockfile
        run: cargo +nightly metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml > /dev/null

      # The corpus is committed, so this is not seeding from scratch --
      # it is the same real blocks of reference-formatted images the gate mutates, which is
      # what gives libFuzzer somewhere to start other than random bytes.
      - name: Show what the corpus holds
        run: |
          find fuzz/corpus -type f | sort
          echo "total: $(find fuzz/corpus -type f | wc -l) seeds"

      # The whole_image target lays its cases over the fixtures the
      # reference tools made (#152). Building them takes the harness VM, so
      # the newest landed tree's are fetched instead. Since #238 a push to
      # main runs only the quick checks and uploads no fixtures; the full
      # pipeline, and with it the fixtures, runs in the merge queue. So the
      # newest unexpired `fixtures` artifact is taken from a successful CI
      # run on main or on a main merge-queue branch, which is the tree that
      # landed (#239).
      - name: Fetch the fixtures from the newest landed tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run=""
          for candidate in $(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=fixtures&per_page=50" \
              --jq '.artifacts[] | select(.expired | not)
                    | select(.workflow_run.head_branch == "main" or (.workflow_run.head_branch | startswith("gh-readonly-queue/main/")))
                    | .workflow_run.id'); do
            if [ "$(gh run view "$candidate" --repo "$GITHUB_REPOSITORY" --json workflowName,conclusion --jq '.workflowName + " " + .conclusion')" = "CI success" ]; then
              run=$candidate
              break
            fi
          done
          [ -n "$run" ] || { echo "no successful main or merge-queue CI run has an unexpired fixtures artifact" >&2; exit 1; }
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name fixtures --dir "$RUNNER_TEMP/fixtures"
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures/fixtures.tar.gz" -C .vm-share
          echo "fixtures from run $run: $(find .vm-share/fixtures -name '*.img' | wc -l) images"

      - name: Fuzz
        run: ./scripts/fuzz-all.sh "${{ inputs.seconds || '120' }}"

      # WITHOUT THIS THE FINDING IS LOST. A crash reproducer lives in
      # fuzz/artifacts/<target>/ on the runner, and the runner is thrown
      # away. The log says a target crashed and the bytes that caused it
      # would be gone, which would leave the next person re-deriving an
      # input the fuzzer had already found.
      - name: Keep the reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 90

      # A FAILED NIGHT IS FILED, NOT LOST (#148). The scheduled run failed
      # two nights running before anyone looked, because a scheduled
      # failure notifies no one. It opens a ci-failure issue, or comments
      # on the open one, naming the run.
      - name: File a failed scheduled run
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly fuzz run failed"
          open="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label ci-failure \
              --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label ci-failure --title "$title" \
              --body "The scheduled fuzz run failed: $RUN_URL. A crash leaves its reproducer in the run's fuzz-artifacts; a failure before any target ran (a stale fuzz/Cargo.lock, a missing corpus) leaves none, and the log says which."
          fi
