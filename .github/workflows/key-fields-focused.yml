name: key fields focused

# One bounded route for #226; this does not replace any full CI gate.
on:
  pull_request:
    paths:
      - .github/workflows/key-fields-focused.yml
      - scripts/guest-key-fields-focused.sh
      - tests/scripts/key-fields-focused-uses-kept-assets.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CHORE_VERSION: "0.11.0"
  CARGO_BUILD_JOBS: "2"
  KEPT_TAG: differential-fixtures-1
  KEPT_TARBALL: 6edbb7c0675ce7735a49ec173c0d371d707847a4885946d2010c1ebad51f36d7

jobs:
  key-fields-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: Pinned siblings
        run: chore siblings
      - name: Fetch durable fixture and physical image read evidence
        env:
          GH_TOKEN: ${{ github.token }}
          READ_DIGEST: 33232537b5b1862123aca61ce9a75d34c4fdaa588d1f9a969338932cef5a43b6
        run: |
          set -euo pipefail
          bash scripts/kept-fixtures.sh fetch "$KEPT_TAG" "$KEPT_TARBALL" "$RUNNER_TEMP/fixtures"
          mkdir -p "$RUNNER_TEMP/default206-read"
          gh release download "$KEPT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern default206-reference.zip --dir "$RUNNER_TEMP/default206-read" --clobber
          echo "$READ_DIGEST  $RUNNER_TEMP/default206-read/default206-reference.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/default206-read/default206-reference.zip" \
            -d "$RUNNER_TEMP/default206-read/evidence"
          python3 scripts/pinned-default74-read-controls.py "$RUNNER_TEMP/default206-read/evidence"
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures/fixtures.tar.gz" -C .vm-share
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: Unchanged size/snapshot cases and native key refusals
        run: |
          set -euo pipefail
          vm=../fs-linux-test-harness/scripts/vm.sh
          trap '"$vm" down' EXIT
          share="$("$vm" share)"
          bash ../rust-fs-core/scripts/stage-siblings.sh "$share" rust-fs-core -- \
            "$vm" run 'cd /repo && bash scripts/guest-key-fields-focused.sh'
      - name: Keep the focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-fields-focused
          path: tmp/logs/key-fields-focused.log
          if-no-files-found: error
      - name: The guest is down
        if: always()
        run: '! ../fs-linux-test-harness/scripts/vm.sh status'
