name: key fields focused

# One bounded route for #226; this does not replace any full CI gate.
on:
  pull_request:
    paths:
      - .github/workflows/key-fields-focused.yml
      - scripts/guest-key-fields-focused.sh
      - tests/scripts/key-fields-focused-uses-kept-assets.sh
  workflow_dispatch:

permissions:
  contents: read

env:
  CHORE_VERSION: "0.11.0"
  CARGO_BUILD_JOBS: "2"
  # The shared guest's size. Harness v0.8.0 and later size it by a host
  # resource profile, which on a GitHub-hosted runner is a small guest (2G,
  # 2 CPUs). With that size the kernel SIGKILLs test binaries in the guest
  # (oracle_fuzz_whole_image and check_oracle on #718, run 44964869562). The
  # size the suites were validated on before the profiles is 4G and 4 CPUs,
  # as in rust-fs-xfs and rust-fs-btrfs.
  FLTH_SHARED_MEMORY: 4G
  FLTH_SHARED_CPUS: "4"
  KEPT_TAG: differential-fixtures-1
  KEPT_TARBALL: 6edbb7c0675ce7735a49ec173c0d371d707847a4885946d2010c1ebad51f36d7

jobs:
  key-fields-focused-gate:
    runs-on: antimatter-vps-gate
    timeout-minutes: 1
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        run: runner-gate pick linux-x64-kvm

  key-fields-focused:
    needs: key-fields-focused-gate
    runs-on: ${{ needs.key-fields-focused-gate.outputs.runner }}
    timeout-minutes: 150
    steps:
      - name: gh for the gated runner
        # A gated self-hosted runner has no GitHub CLI, and this job calls gh
        # (directly, or through scripts/kept-fixtures.sh).
        if: runner.environment == 'self-hosted'
        run: command -v gh >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq gh; }
      - uses: actions/checkout@v4
      - name: C toolchain for the gated runner
        # Only a self-hosted Linux runner lacks it; the hosted image has it.
        run: |
          if [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            sudo apt-get update && sudo apt-get install -y build-essential
          fi
      - name: Install chore
        run: scripts/ci-install-chore.sh
      - name: Pinned siblings
        run: chore siblings
      - name: Fetch durable fixture and physical image read evidence
        env:
          GH_TOKEN: ${{ github.token }}
          READ_DIGEST: 33232537b5b1862123aca61ce9a75d34c4fdaa588d1f9a969338932cef5a43b6
        run: |
          set -euo pipefail
          bash scripts/kept-fixtures.sh fetch "$KEPT_TAG" "$KEPT_TARBALL" "$RUNNER_TEMP/fixtures"
          mkdir -p "$RUNNER_TEMP/default206-read"
          gh release download "$KEPT_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern default206-reference.zip --dir "$RUNNER_TEMP/default206-read" --clobber
          echo "$READ_DIGEST  $RUNNER_TEMP/default206-read/default206-reference.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/default206-read/default206-reference.zip" \
            -d "$RUNNER_TEMP/default206-read/evidence"
          python3 scripts/pinned-default74-read-controls.py "$RUNNER_TEMP/default206-read/evidence"
          mkdir -p .vm-share
          tar -xzf "$RUNNER_TEMP/fixtures/fixtures.tar.gz" -C .vm-share
      - name: Upstream virtiofsd 1.14.0
        # Ubuntu 24.04 packages virtiofsd 1.10.0, which never answers a
        # non-UTF-8 xattr name (fs-linux-test-harness #274). The tag must
        # match LINUX_HARNESS_REF in chores.yml.
        uses: antimatter-studios/fs-linux-test-harness/.github/actions/install-virtiofsd@v0.9.1
      - name: KVM, QEMU and Vagrant
        id: vm-host
        run: ../fs-linux-test-harness/scripts/ci-setup-linux.sh
      - name: Cache the Vagrant box
        uses: actions/cache@v4
        with:
          path: ~/.vagrant.d/boxes
          key: ${{ steps.vm-host.outputs.box-cache-key }}
      - name: Unchanged size/snapshot cases and native key refusals
        run: |
          set -euo pipefail
          vm=../fs-linux-test-harness/scripts/vm.sh
          share="$("$vm" share)"
          bash ../rust-fs-core/scripts/stage-siblings.sh "$share" rust-fs-core -- \
            "$vm" run 'cd /repo && bash scripts/guest-key-fields-focused.sh'
      - name: Keep the focused log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: key-fields-focused
          path: tmp/logs/key-fields-focused.log
          if-no-files-found: error
