version: "3"
chore_min_version: 0.10.0

# Every task names a script or a cargo command and nothing else. The family's
# scripts (tier.sh, test-floor.sh, ci-gate.sh, family-check.sh,
# agents-core-check.sh, semver-check.sh, release-notes.sh, package-cli.sh)
# run IN PLACE from the rust-fs-core sibling; this repository keeps no copy.
vars:
  TRIPLE: aarch64-apple-darwin
  LIBNAME: fs_bcachefs
  FS_CORE_URL: https://github.com/antimatter-studios/rust-fs-core.git
  FS_CORE_REF: v0.4.2
  LINUX_HARNESS_URL: https://github.com/antimatter-studios/fs-linux-test-harness.git
  # v0.5.5 lets a host admit more than one VM (FLTH_SLOT_COUNT). v0.5.6 gives
  # back what a guest deletes and says what stopped a lost guest.
  # v0.5.8: a signal to a session stops everything its command started, and
  # leaves the shares of a VM that stays up (harness #117, #130). v0.5.9 runs a
  # `vm.sh run` or `vm.sh exec` command through `bash -c`, with no stdin.
  # v0.6.1: the VM-free suite runs no real `sync` on the host (harness #191), so
  # this repository's script guards over the stub engine stop flushing the
  # machine's disks, and suites can share one guest through FLTH_SHARED_ROOT
  # (harness #153). A macOS host now needs vagrant-notify-forwarder-christhomas
  # 0.7.7 or newer, which `chore vm:host:check` says (harness #164).
  # v0.6.2: the stub engine runs no real `sync` whatever PATH a guard sets
  # (harness #202), and CI setup moves off a stalled Ubuntu mirror (harness #200).
  LINUX_HARNESS_REF: v0.6.2

includes:
  vm:
    taskfile: ../fs-linux-test-harness/vm.chores.yml
    optional: true

# The safety net for a VM nothing cleaned up.
lifecycle:
  after_all:
    - '[ ! -x ../fs-linux-test-harness/scripts/vm.sh ] || ../fs-linux-test-harness/scripts/vm.sh reap'

tasks:
  siblings:
    desc: Check out the sibling repos this crate builds and tests against, at their pinned refs
    cmds:
      - |
        set -eu
        common="$(git rev-parse --path-format=absolute --git-common-dir)"
        siblings_root="$(cd "$(git rev-parse --show-toplevel)/.." && pwd)"
        printf '%s\t%s\t%s\n' \
          rust-fs-core          '{{.FS_CORE_URL}}'       '{{.FS_CORE_REF}}' \
          fs-linux-test-harness '{{.LINUX_HARNESS_URL}}' '{{.LINUX_HARNESS_REF}}' \
        | while IFS="$(printf '\t')" read -r name url ref; do
            dir="$siblings_root/$name"
            fetch_ref() {
              git -C "$dir" fetch --quiet origin tag "$ref" 2>/dev/null ||
                git -C "$dir" fetch --quiet origin "$ref"
            }
            if [ ! -e "$dir/.git" ]; then
              echo "siblings: cloning $name at $ref"
              git init --quiet "$dir"
              git -C "$dir" remote add origin "$url"
              fetch_ref
              git -C "$dir" checkout --quiet FETCH_HEAD
              continue
            fi
            resolved_ref="$ref"
            if fetch_ref; then resolved_ref=FETCH_HEAD; fi
            if git -C "$dir" merge-base --is-ancestor "$resolved_ref" HEAD 2>/dev/null; then
              echo "siblings: $name at or ahead of $ref"
              if ! git -C "$dir" merge-base --is-ancestor HEAD "$resolved_ref" 2>/dev/null; then
                echo "siblings: $name is ahead of $ref; use a detached worktree of $ref at ~/projects/worktrees/rust-fs-bcachefs-<id>/$name."
                echo "siblings: put this repository beside it at ~/projects/worktrees/rust-fs-bcachefs-<id>/rust-fs-bcachefs; see AGENTS.md: Pinned siblings beside a worktree."
              fi
            else
              echo "siblings: $name is below $ref; this task will not move a shared checkout -- move it yourself." >&2
              exit 1
            fi
          done

  fixtures:
    desc: 'Build the .vm-share fixtures and their oracle JSON with the reference tools, in the harness VM'
    timeout: 90m
    on_timeout:
      - cmd: '../fs-linux-test-harness/scripts/vm.sh down || true'
    cmds: ['scripts/build-fixtures.sh']

  fixtures:clean:
    desc: Remove the built fixtures (regenerable)
    cmds: ['rm -rf .vm-share/fixtures']

  # BUDGETS AND FLOORS ARE MEASURED (2026-10-06). unit: 39 lines / 2145
