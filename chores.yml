      - 'bash ../rust-fs-core/scripts/tier.sh --refuse-ignored test:unit unit-cli-bin 150 12000 -- cargo test --locked --features cli --bin rust-fs-bcachefs -- --quiet'
      # #488 adds four cases for the names and paths a tree import takes.
      # #590 adds two help cases: 8 executed locally on 2026-11-04.
      - 'bash ../rust-fs-core/scripts/test-floor.sh --refuse-ignored unit-cli-bin 8'

