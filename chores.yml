    cmds: ['scripts/cli-install.sh']

  # Measured with test-write.sh (#46): 21 lines, 839 bytes, 3250 checks.
  # #292 adds 505 mandatory checks: extraction 288, symlink refusals 144,
  # remaining refusals 53, write-readback refusals 4 and generated docs 16.
  # The existing floor rises by that count; CI records the full measurement.
  # Each test file prints three lines; the extra docs file fits the budget.
  # #293 adds 300 checks: 40 successful-write checks, 240 refusal checks,
  # and 20 generated-documentation checks. One new file adds three lines.
  # #294 adds 955 mandatory CLI checks: eleven reference-backed property sets
  # (848, including a nonempty label), dirty/unknown keys (42), refusals (39),
  # help (8), generated docs (18). Execution is recorded by CI.
  # One new file adds three verdict lines (78 bytes); budgets rise by
  # three lines and 150 bytes, retaining the existing path-length margin.
  # #295 adds more than 400 mandatory checks over the actual verb table,
  # malformed/range errors, four flag placements, manifest hashes and writes
  # inside a container. Its one new test file adds exactly three log lines.
  # #260 adds 86 bounded-walk checks and four manifest comparisons. Its
  # new CLI file adds three lines (under 150 bytes) to the tier's log.
  # #251 adds 2189 stat checks to test-stat-tree.sh: nine per stat'd path
  # (shape, types, old keys, target, times within a day of the superblock's
  # last write, and the reference lister's otime, generation, sectors and
  # flags) over 18 paths in each of three sets and 113 in aged, six more per
  # aged path from the reference mount (owner, allocated bytes, three
  # times), and eight refusal and --text checks. It adds no file, so no log
  # line.
  test:cli:
    desc: 'The command-line tools AS INSTALLED, found on PATH: doctor first, then every tests/cli/test-*.sh'
    cmds:
      # #341 adds three scripts: nine fixed header/verdict lines, 274 bytes
      # at their 168 + 11 + 17 success counts, above the existing budget.
      # #342 adds test-export-tree.sh: three more fixed lines, 94 bytes at
      # its 49 checks ("== test-export-tree", its result, its verdict).
      # #442 adds test-export-xattrs.sh: six lines, 146 bytes on a host that
      # refuses trusted.* (its header, two manifest checks' jq answers, the
      # probed namespace, its result and its verdict), 57 of the 58 budgeted.
      # #439 adds test-import.sh: three more fixed lines, 85 bytes at its
      # 26 checks ("== test-import", its result, its verdict). Measured from
      # run 40730320638's cli log with test-import passing and #436's file
      # added: 54 lines, 1828 bytes on the runner's path; with #442's six
      # lines and 146 bytes that is 60 lines and 1974 bytes, under the same
      # byte headroom #442 kept.
      # #488 adds test-import-tree.sh, three fixed lines, and
      # test-import-xattrs.sh, four with the line naming what the host stamps:
      # seven lines. Measured on macOS with both passing: 67 lines, 2186 bytes.
      # The bytes keep room for a runner's longer paths.
      - 'bash ../rust-fs-core/scripts/tier.sh test:cli cli 68 2570 -- scripts/test-cli.sh'
      # #341 adds 168 export, 11 documentation and 17 kernel export checks.
      # #342 adds 49 recursive export checks.
      # #436 adds test-help-examples.sh: 79 checks (three setup, four per
      # verb over 19 verbs) and three log lines, 51 of the 52 budgeted.
      # #442 adds 18 attribute checks where the host stores trusted.* (macOS,
      # measured) and 20 where it refuses them; the floor takes the lower.
      # #439 adds 26 import checks, and for the import verb it adds to the
      # table four help-example and 21 offset checks.
      # #437 adds three checks to test-read-docs.sh (cat in each generated
      # completion file) and no file, so no log line.
      # #488 adds 68 tree import checks and attribute checks that depend on
      # the host: 40 where new files carry no stamp, 17 where macOS stamps
      # them (measured); the floor takes the lower.
      - 'bash ../rust-fs-core/scripts/test-floor.sh cli 8010'

  test:
    desc: 'Unit, scripts, then oracle, exactly as CI runs them'
    cmds:
      - task: test:unit
      - task: test:scripts
      - task: test:oracle

  fuzz:
    desc: 'Run every fuzz target for a bounded time: chore fuzz [-- seconds]'
    cmds: ['scripts/fuzz-all.sh $CLI_ARGS']

  fuzz:corpus:
    desc: 'Rebuild the fuzz seeds from the fixtures (needs chore fixtures); committed reproducers are kept'
    cmds: ['scripts/make-fuzz-corpus.sh']

  # Not a test tier and not a pull-request gate (#164): its result depends
  # on its seeds. .github/workflows/differential.yml runs it nightly.
  fuzz:differential:
    desc: 'This crate and the reference checker on the same damaged images (needs chore fixtures, docker; Linux): chore fuzz:differential [-- cases [first-seed]]'
    cmds: ['scripts/differential-fuzz.sh $CLI_ARGS']

  lint:
    desc: Formatting, clippy, the family's structural checks and the licence gate, exactly as CI runs them
    cmds:
      - bash ../rust-fs-core/scripts/agents-core-check.sh
      - bash ../rust-fs-core/scripts/changelog-check.sh
      - bash ../rust-fs-core/scripts/features-check.sh
      - bash ../rust-fs-core/scripts/ci-gate.sh
      - bash ../rust-fs-core/scripts/family-check.sh
      - cargo fmt --check
      # S1's prose stays out (#154): no run of eight words is the PDF's
      # verbatim, judged against hashes of its phrases, never its text.
      - python3 scripts/s1-overlap.py check
      - cargo clippy --locked --all-targets --features cli,write -- -D warnings
      # Every crate the shipped artifacts link has its notice (#155).
      - python3 scripts/third-party-notices.py check
      # The licence gate: every crate in the graph is permissive (deny.toml).
      - scripts/licenses.sh
      # The fuzz workspace builds from its own lockfile (#148). It depends on
      # this crate by path, so a dependency added here changes it, and only the
      # nightly fuzz run read it: two nights failed before anyone saw.
      - 'cargo metadata --locked --format-version 1 --manifest-path fuzz/Cargo.toml >/dev/null'

  staticlib:
    desc: Build the static library and its headers into this crate's dist/
    vars:
      OUT: 'dist'
    cmds:
      - 'rustup target add {{.TRIPLE}}'
      - 'cargo build --release --target {{.TRIPLE}}'
      - 'mkdir -p "{{.OUT}}/include"'
      - 'cp target/{{.TRIPLE}}/release/lib{{.LIBNAME}}.a "{{.OUT}}/lib{{.LIBNAME}}.a"'
      - 'cp include/{{.LIBNAME}}.h "{{.OUT}}/include/{{.LIBNAME}}.h"'
      - 'cp "../rust-fs-core/include/fs_core.h" "{{.OUT}}/include/fs_core.h"'
      # The library links its dependencies in, so their notices go with it (#155).
      - 'cp LICENSE THIRD-PARTY-LICENSES.md "{{.OUT}}/"'

  artifact:
    desc: Print the absolute path of the directory holding the built outputs
    silent: true
    cmds:
      - 'cd "{{.OUT}}" && pwd -P'
    vars:
      OUT: 'dist'

  # Line coverage of the unit and oracle tiers together, which is what the
  # suite exercises; fails under the floor. MEASURED 2026-10-07 (macOS
  # arm64, the fixtures of this tree): 87.84% of lines, 38 tests, 114 log
  # lines / 8417 bytes warm (a cold runner adds a Compiling line per
  # dependency); 204 lines / 12403 bytes on a cold CI runner once the
  # checker's tests joined (run of #39, 2026-10-07): the line budget is 300.
  # The floor sits a
  # little under that and moves up with the suite.
  coverage:
    desc: 'Line coverage of the unit and oracle tiers (needs chore fixtures and cargo-llvm-cov): fails under the floor'
    cmds:
      # Raised with the oracle tier's budget (2026-10-07): the same nine new
      # test binaries print here too. Raised again for a cold runner
      # (2026-10-14): 447 lines / 23,872 bytes warm on main (run 38503084219),
      # 496 lines / 25,990 bytes on #212's run, whose changed fuzz lockfile
      # missed the cache and added a Downloaded and a Compiling line per
      # dependency, 43 lines. 520 holds a cold run and two more test binaries.
      # Raised again (2026-10-16): the agent-core v7 pull request's merge-queue
      # run 38968265210 printed 557 lines / 28,786 bytes, its fuzz lockfile
      # moving to rust-fs-core 0.3.12 missing the cache the same way. About
      # 30% over that is 720 lines; the bytes still fit 40,000.
      # #338's oracle tests printed 723 lines; the budget moves to 780.
      # COVERAGE MEASURED 2026-11-02 (#465, #469, #473, run 41540843571): 749
      # lines / 40,250 bytes on a passing run. Both budgets rise about 30%
      # above that run, to 980 lines and 52,000 bytes.
      - 'bash ../rust-fs-core/scripts/tier.sh --refuse-ignored coverage coverage 980 52000 -- scripts/test-scratch-run.sh cargo llvm-cov --locked --summary-only --fail-under-lines 85 --lib --test fuzz_decoders --test "oracle_*" --test capi'
      # Runs 38997027177 and 39037096192 each executed 138 coverage cases.
      # #253/#254 add two unit cases, and #218 adds two more; the new
      # write-feature oracle and parser cases are outside this command.
      # #247's primary-only regression also runs under coverage.
      # #250's write-feature cases do not run in this default-feature tier.
      # #271's eleven encrypted-node cases run here.
      # #272's eight encrypted-extent cases run here.
      # #261's host optional-field regression also runs here.
      # #262 adds one unit and one host oracle case.
      # #335 adds one 128-bit extent MAC unit case and one oracle case.
      # Measured 2026-10-27 on fix/163-node-backpointer: 205 cases, 87.84%
      # line coverage; the exact base's merge-tree CI ran 204 before this unit case.
      # #452's two unit cases also run in this default-feature tier.
      # The three unit cases of #465, #469 and #473 run in this tier too.
      # The unit case of #422 runs in this tier too.
      # #506 adds its unit boundary case to this tier too.
      # #505 adds its three never-started unit cases to this tier too.
      # #507 adds two default-feature unit cases.
      # #533 adds its two started-superblock unit cases to this tier too.
      # #562 adds two default-feature unit cases.
      # #589 adds one default-feature unit case.
      # #521 adds its three snapshot claim unit cases to this tier too.
      - 'bash ../rust-fs-core/scripts/test-floor.sh --refuse-ignored coverage 225'

  check:semver:
    desc: Refuse a public-API break the version in Cargo.toml does not declare
    cmds:
      - 'bash ../rust-fs-core/scripts/tier.sh semver semver 40 4000 -- scripts/check-semver.sh'

  build:
    desc: Debug build
    cmds: ['cargo build']

  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']
