version: "3"
chore_min_version: 0.10.0

# Every task names a script or a cargo command and nothing else. The family's
# scripts (tier.sh, test-floor.sh, ci-gate.sh, family-check.sh,
# agents-core-check.sh, semver-check.sh, release-notes.sh, package-cli.sh)
# run IN PLACE from the rust-fs-core sibling; this repository keeps no copy.
vars:
  TRIPLE: aarch64-apple-darwin
  LIBNAME: fs_bcachefs
  FS_CORE_URL: https://github.com/antimatter-studios/rust-fs-core.git
  FS_CORE_REF: v0.3.8
  LINUX_HARNESS_URL: https://github.com/antimatter-studios/fs-linux-test-harness.git
  LINUX_HARNESS_REF: v0.4.1

includes:
  vm:
    taskfile: ../fs-linux-test-harness/vm.chores.yml
    optional: true

# The safety net for a VM nothing cleaned up.
lifecycle:
  after_all:
    - '[ ! -x ../fs-linux-test-harness/scripts/vm.sh ] || ../fs-linux-test-harness/scripts/vm.sh reap'

tasks:
  siblings:
    desc: Check out the sibling repos this crate builds and tests against, at their pinned refs
    cmds:
      - |
        set -eu
        common="$(git rev-parse --path-format=absolute --git-common-dir)"
        siblings_root="$(cd "$(git rev-parse --show-toplevel)/.." && pwd)"
        printf '%s\t%s\t%s\n' \
          rust-fs-core          '{{.FS_CORE_URL}}'       '{{.FS_CORE_REF}}' \
          fs-linux-test-harness '{{.LINUX_HARNESS_URL}}' '{{.LINUX_HARNESS_REF}}' \
        | while IFS="$(printf '\t')" read -r name url ref; do
            dir="$siblings_root/$name"
            if [ ! -e "$dir/.git" ]; then
              echo "siblings: cloning $name at $ref"
              git init --quiet "$dir"
              git -C "$dir" remote add origin "$url"
              git -C "$dir" fetch --quiet origin "$ref"
              git -C "$dir" checkout --quiet FETCH_HEAD
              continue
            fi
            git -C "$dir" fetch --quiet origin "$ref" || true
            if git -C "$dir" merge-base --is-ancestor "$ref" HEAD 2>/dev/null; then
              echo "siblings: $name at or ahead of $ref"
            else
              echo "siblings: $name is below $ref; this task will not move a shared checkout -- move it yourself." >&2
              exit 1
            fi
          done

  fixtures:
    desc: 'Build the .vm-share fixtures and their oracle JSON with the reference tools, in the harness VM'
    timeout: 90m
    on_timeout:
      - cmd: '../fs-linux-test-harness/scripts/vm.sh down || true'
    cmds: ['scripts/build-fixtures.sh']

  fixtures:clean:
    desc: Remove the built fixtures (regenerable)
    cmds: ['rm -rf .vm-share/fixtures']

  # BUDGETS AND FLOORS ARE MEASURED (2026-10-06). unit: 39 lines / 2145
  # bytes warm on macOS arm64, 56 lines / 2729 bytes on a cold CI runner with
  # fewer dependencies than now; 21 tests executed. oracle: 53 lines / 2086
  # bytes warm; 9 tests. The line budgets leave room for a cold build's
  # `Compiling` lines (one per dependency); a floor moves up with its suite
  # and never down. FLOORS RAISED 2026-10-08 (#83) to the counts CI run
  # 37689702536 on main (dbeced4, 2026-10-07) executed: unit 34, oracle 62,
  # vm 105, coverage 81.
  test:unit:
    desc: 'No tool, no fixture, no VM: the library and every test that reaches neither (debug, overflow checks on)'
    cmds:
      - 'EXPECT_OVERFLOW_CHECKS=1 bash ../rust-fs-core/scripts/tier.sh --refuse-ignored test:unit unit 150 12000 -- cargo test --locked --lib --test fuzz_decoders -- --nocapture'
      - 'bash ../rust-fs-core/scripts/test-floor.sh --refuse-ignored unit 34'

  test:oracle:
    desc: 'Every fixture read by this crate and compared with the reference tools'' recorded view (needs chore fixtures)'
    cmds:
      # MEASURED 2026-10-07 at this change: 165 lines / 7135 bytes (the
      # write-path tests of #43 took it past the old 150). The review stack
      # above adds nine oracle test binaries (superblock copies, blacklist,
      # pointers, ranged reads, cursor end, strhash, probes, bgcompress,
      # refusals), about eight lines each: 300 lines / 20000 bytes leaves
      # room for a cold runner's Compiling lines on top of that.
      # MEASURED 2026-10-09, CI run 37924323574 (#126, casefold): 317 lines /
      # 14165 bytes, 21 of them Compiling lines. The open pull requests add
      # about five more oracle binaries (eight lines each): 400 lines leaves
      # room for them and a colder runner; bytes stay well inside 20000.
      #
      # BUILT FIRST, OUTSIDE THE BUDGET, as rust-fs-erofs#189 does: the same
      # command with `--no-run --quiet`, so a cold cache's download and
      # Compiling lines are not the tier's output at all. Before it, a change
      # to Cargo.lock printed 322 lines against the old 300 with every test
      # passing (#131), and a merge queue group that moves the lockfile would
      # be refused the same way.
      - 'cargo test --locked --release --features write --test "oracle_*" --test capi --no-run --quiet'
      - 'bash ../rust-fs-core/scripts/tier.sh --refuse-ignored test:oracle oracle 400 20000 -- cargo test --locked --release --features write --test "oracle_*" --test capi'
      - 'bash ../rust-fs-core/scripts/test-floor.sh --refuse-ignored oracle 62'

  test:scripts:
    desc: The shell tests (tests/scripts/*.sh), every one by glob
    # By glob, so a test added later needs no edit here: a guard that has
    # to be registered somewhere else is a guard that gets silently
    # skipped. They test the scripts that drive the fuzzer (sandboxed
    # stand-ins for cargo, no toolchain needed). BUDGET: two tests, one
    # PASS line each, plus the tier's own lines.
    cmds:
      - |
        bash ../rust-fs-core/scripts/tier.sh test:scripts scripts 40 2500 -- bash -c '
          set -eu
          for t in tests/scripts/*.sh; do
            echo "== $t"
            bash "$t"
          done
        '

  test:vm:
    desc: 'The unit and oracle tiers compiled and run INSIDE the harness VM (how a Mac runs the Linux tests)'
    # scripts/guest-suite.sh, through the harness's [test] guest_command.
    # The siblings are staged on the share from their pinned HEAD first
    # (rust-fs-core's stage-siblings, run in place); the toolchain and the
    # build live on the VM's own disk, so later runs are incremental.
    # BUDGET MEASURED on CI run 37689702536 (main, dbeced4, 2026-10-07), a
    # cold guest build: 396 lines / 18716 bytes, four lines under the old
    # 400. 520 lines / 28000 bytes leaves room for the next few test
    # binaries (about eight lines each, twice: debug and release). FLOOR:
    # 105 tests, what that run executed. MEASURED AGAIN on CI run
    # 38023909461 (#135 on main 03421a9, 2026-10-10): 522 lines / 25027
    # bytes, two lines over 520 once #122's tests landed. 640 lines /
    # 32000 bytes leaves room for the tests the open pull requests add.
    timeout: 120m
    on_timeout:
      - cmd: '../fs-linux-test-harness/scripts/vm.sh down || ../fs-linux-test-harness/scripts/vm.sh destroy'
    cmds:
      - |
        set -eu
        [ -x ../fs-linux-test-harness/scripts/vm.sh ] || {
          echo "test:vm needs the harness sibling -- run 'chore siblings'." >&2
          exit 1
        }
        share="$(../fs-linux-test-harness/scripts/vm.sh share)"
        FS_CORE_CALLER="$(pwd -P)" bash ../rust-fs-core/scripts/tier.sh --refuse-ignored test:vm vm 640 32000 -- \
          bash ../rust-fs-core/scripts/stage-siblings.sh "$share" rust-fs-core -- \
          ../fs-linux-test-harness/scripts/vm.sh guest-test
      - 'bash ../rust-fs-core/scripts/test-floor.sh --refuse-ignored vm 105'

  # The command-line tools as installed. MEASURED 2026-10-06 (macOS arm64,
  # the eight formatter-made sets): 11 lines / 510 bytes, 2498 checks;
  # with stat and tree (2026-10-07): 14 lines / 606 bytes, 3197 checks.
  # Budget half as much again plus room for a runner's longer paths; the
  # floor is about 95% of the checks.
  cli:install:
    desc: 'Build the command-line tools (release, --features cli) and stage them as an install prefix in tmp/cli'
    cmds: ['scripts/cli-install.sh']

  # Measured with test-write.sh (#46): 21 lines, 839 bytes, 3250 checks.
  # Each test file prints three lines; the budget has room for one more.
  # The floor is about 95% of the checks.
  test:cli:
    desc: 'The command-line tools AS INSTALLED, found on PATH: doctor first, then every tests/cli/test-*.sh'
    cmds:
      - 'bash ../rust-fs-core/scripts/tier.sh test:cli cli 24 1000 -- scripts/test-cli.sh'
      - 'bash ../rust-fs-core/scripts/test-floor.sh cli 3090'

  test:
    desc: 'Unit, scripts, then oracle, exactly as CI runs them'
    cmds:
      - task: test:unit
      - task: test:scripts
      - task: test:oracle

  fuzz:
    desc: 'Run every fuzz target for a bounded time: chore fuzz [-- seconds]'
    cmds: ['scripts/fuzz-all.sh $CLI_ARGS']

  fuzz:corpus:
    desc: 'Rebuild the fuzz seeds from the fixtures (needs chore fixtures); committed reproducers are kept'
    cmds: ['scripts/make-fuzz-corpus.sh']

  lint:
    desc: Formatting, clippy, the family's structural checks and the licence gate, exactly as CI runs them
    cmds:
      - bash ../rust-fs-core/scripts/agents-core-check.sh
      - bash ../rust-fs-core/scripts/ci-gate.sh
      - bash ../rust-fs-core/scripts/family-check.sh
      - cargo fmt --check
      - cargo clippy --locked --all-targets --features cli,write -- -D warnings
      # The licence gate: every crate in the graph is permissive (deny.toml).
      - scripts/licenses.sh

  staticlib:
    desc: Build the static library and its headers into this crate's dist/
    vars:
      OUT: 'dist'
    cmds:
      - 'rustup target add {{.TRIPLE}}'
      - 'cargo build --release --target {{.TRIPLE}}'
      - 'mkdir -p "{{.OUT}}/include"'
      - 'cp target/{{.TRIPLE}}/release/lib{{.LIBNAME}}.a "{{.OUT}}/lib{{.LIBNAME}}.a"'
      - 'cp include/{{.LIBNAME}}.h "{{.OUT}}/include/{{.LIBNAME}}.h"'
      - 'cp "../rust-fs-core/include/fs_core.h" "{{.OUT}}/include/fs_core.h"'

  artifact:
    desc: Print the absolute path of the directory holding the built outputs
    silent: true
    cmds:
      - 'cd "{{.OUT}}" && pwd -P'
    vars:
      OUT: 'dist'

  # Line coverage of the unit and oracle tiers together, which is what the
  # suite exercises; fails under the floor. MEASURED 2026-10-07 (macOS
  # arm64, the fixtures of this tree): 87.84% of lines, 38 tests, 114 log
  # lines / 8417 bytes warm (a cold runner adds a Compiling line per
  # dependency); 204 lines / 12403 bytes on a cold CI runner once the
  # checker's tests joined (run of #39, 2026-10-07): the line budget is 300.
  # The floor sits a
  # little under that and moves up with the suite.
  coverage:
    desc: 'Line coverage of the unit and oracle tiers (needs chore fixtures and cargo-llvm-cov): fails under the floor'
    cmds:
      # Raised with the oracle tier's budget (2026-10-07): the same nine new
      # test binaries print here too.
      - 'bash ../rust-fs-core/scripts/tier.sh --refuse-ignored coverage coverage 450 40000 -- cargo llvm-cov --locked --summary-only --fail-under-lines 85 --lib --test fuzz_decoders --test "oracle_*" --test capi'
      - 'bash ../rust-fs-core/scripts/test-floor.sh --refuse-ignored coverage 81'

  check:semver:
    desc: Refuse a public-API break the version in Cargo.toml does not declare
    cmds:
      - 'bash ../rust-fs-core/scripts/tier.sh semver semver 40 4000 -- scripts/check-semver.sh'

  build:
    desc: Debug build
    cmds: ['cargo build']

  clean:
    desc: Remove this crate's cargo output
    cmds: ['cargo clean']
