# fs-linux-test-harness consumer config (see ../fs-linux-test-harness/README.md).
#
# Everything that is Linux happens in here: the reference formatter that
# builds the fixtures and the reference tools whose view of each image is
# recorded beside it. None of them is installed on a workstation, and none
# of them is linked or copied into this repository; they are an oracle at
# arm's length (docs/clean-room.md).

[project]
name = "rust-fs-bcachefs"

[setup]
# Runs as root INSIDE the VM; builds the reference tools in a chroot.
script = "scripts/vm-setup.sh"

[test]
# `chore test:vm`: the unit and oracle tiers, compiled and run in here.
guest_command = "scripts/guest-suite.sh"

[share]
dir = ".vm-share"

[cache]
# Not a cache: a small disk for the test images, which scripts/guest-suite.sh
# mounts as the scratch area. On the guest's own disk, images that are written
# and deleted reach new blocks of the disposable overlay on the host until it has
# touched most of the guest's free space. On a runner with 14 GB free that filled
# the host's disk and stopped the guest (#504). Since harness v0.5.6 the overlay
# gives deleted blocks back, but its peak still counts, and this disk bounds it.
# Since harness v0.7.0 the guest is shared and /cache is a directory of its
# own with no size limit (harness #157), so this no longer bounds the scratch
# area.
size = "2G"
